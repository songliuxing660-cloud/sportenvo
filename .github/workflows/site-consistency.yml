name: Site Consistency Audit

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/check-site-consistency.mjs"
      - "scripts/audit-search.mjs"
      - "scripts/content-fingerprint.mjs"
      - "scripts/sync-search-metadata.mjs"
      - "scripts/test-lead-tracking.mjs"
      - "scripts/test-rfq-context.mjs"
      - "scripts/test-inquiry-context.mjs"
      - "scripts/test-club-planning.cjs"
      - "scripts/test-indexnow.py"
      - "scripts/sync-buyer-content.py"
      - "scripts/test-buyer-content.py"
      - "scripts/test-keyword-intent.py"
      - "scripts/sync-guide-content.py"
      - "scripts/test-guide-evidence.py"
      - "scripts/test-crawl-policy.py"
      - "scripts/audit-technical-seo.py"
      - "scripts/sync-home-links.py"
      - "scripts/test-technical-seo.py"
      - ".github/workflows/indexnow.yml"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - ".github/workflows/site-consistency.yml"
  pull_request:
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/check-site-consistency.mjs"
      - "scripts/audit-search.mjs"
      - "scripts/content-fingerprint.mjs"
      - "scripts/sync-search-metadata.mjs"
      - "scripts/test-lead-tracking.mjs"
      - "scripts/test-rfq-context.mjs"
      - "scripts/test-inquiry-context.mjs"
      - "scripts/test-club-planning.cjs"
      - "scripts/test-indexnow.py"
      - "scripts/sync-buyer-content.py"
      - "scripts/test-buyer-content.py"
      - "scripts/test-keyword-intent.py"
      - "scripts/sync-guide-content.py"
      - "scripts/test-guide-evidence.py"
      - "scripts/test-crawl-policy.py"
      - "scripts/audit-technical-seo.py"
      - "scripts/sync-home-links.py"
      - "scripts/test-technical-seo.py"
      - ".github/workflows/indexnow.yml"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check canonical, meta, H1 and navigation consistency
        run: node scripts/check-site-consistency.mjs
      - name: Check sitemap, metadata, structured data and crawl depth
        run: node scripts/audit-search.mjs --strict
      - name: Check sitemap XML, public snippets and AI crawl permissions
        run: python3 scripts/test-crawl-policy.py
      - name: Check homepage normalization, contextual links and protected Hero
        run: |
          python3 scripts/audit-technical-seo.py --strict
          python3 scripts/test-technical-seo.py
      - name: Check enquiry attribution and confirmed conversions
        run: node --test scripts/test-lead-tracking.mjs
      - name: Check product preferences through the RFQ buyer path
        run: node --test scripts/test-rfq-context.mjs
      - name: Check product and project details reaching the inquiry form
        run: node --test scripts/test-inquiry-context.mjs
      - name: Check club planning calculations and invalid inputs
        run: node --test scripts/test-club-planning.cjs
      - name: Check deployment fingerprints through edge transformations
        run: python3 scripts/test-indexnow.py
      - name: Check visible buyer answers and approved brand entity
        run: |
          python3 scripts/sync-buyer-content.py
          python3 scripts/test-buyer-content.py
      - name: Check distinct catalog, solution and procurement search intents
        run: python3 scripts/test-keyword-intent.py
      - name: Check guide evidence boundaries and visible FAQ answers
        run: |
          python3 scripts/sync-guide-content.py
          python3 scripts/test-guide-evidence.py
