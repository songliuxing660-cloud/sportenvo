name: Temporary merge duplicate sections (delete before merge)

on:
  push:
    branches: [merge-duplicate-sections]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Merge duplicate homepage sections with byte-preserving edits
        run: |
          python3 - <<'PY'
          import re
          CRLF = bytes([13, 10])
          LF = bytes([10])

          def eol_at(b, i):
              if b[i:i+2] == CRLF:
                  return CRLF
              if b[i:i+1] == LF:
                  return LF
              return b""

          def bounds(b, sid):
              m = re.search(b'<section[^>]*id="' + sid + b'"', b)
              assert m, "missing section " + sid.decode()
              start = m.start()
              end = b.index(b"</section>", start) + len(b"</section>")
              assert b[start:end].count(b"<section") == 1, "nested section in " + sid.decode()
              return start, end

          p = "index.html"
          b = open(p, "rb").read()
          before_len = len(b)

          # 1. take the hub links out of the solutions section, then drop that section
          s0, s1 = bounds(b, b"solutions")
          m = re.search(b'<div class="home-solution-actions">.*?</div>', b[s0:s1], re.S)
          assert m, "solution actions not found"
          actions = m.group(0)
          assert actions.count(b"<a ") == 3, "expected 3 links"
          j = s1 + len(eol_at(b, s1))
          while b[j:j+1] in (b" ", b"\t"):
              j += 1
          b = b[:s0] + b[j:]
          assert b.count(b'id="solutions"') == 0
          print("solutions section removed")

          # 2. re-home the hub links at the end of the court systems section
          c0, c1 = bounds(b, b"court-systems")
          close = c1 - len(b"</section>")
          if b[close-2:close] == CRLF:
              eol = CRLF
          elif b[close-1:close] == LF:
              eol = LF
          else:
              raise AssertionError("unexpected bytes before </section> in court-systems")
          b = b[:close] + b"  " + actions + eol + b[close:]
          print("hub links moved into court-systems")

          # 3. drop the repeated step grid from the brand profile section
          g0, g1 = bounds(b, b"brand-supply-profile")
          sec = b[g0:g1]
          gs = sec.index(b'<div class="logic-grid">')
          while gs > 0 and sec[gs-1:gs] in (b" ", b"\t"):
              gs -= 1
          k = sec.index(b"Production &amp; Delivery Support", gs)
          k2 = sec.index(b"</p></div>", k) + len(b"</p></div>")
          k3 = sec.index(b"</div>", k2) + len(b"</div>")
          ge = k3 + len(eol_at(sec, k3))
          b = b[:g0] + sec[:gs] + sec[ge:] + b[g1:]
          assert b.count(b"logic-grid") == 0, "logic-grid still present"
          assert b.count(b"<section") == b.count(b"</section>"), "unbalanced sections"
          open(p, "wb").write(b)
          print("brand profile grid removed; bytes", before_len, "->", len(b))
          PY
      - name: Refresh content fingerprints
        run: node scripts/sync-search-metadata.mjs --write
      - name: Change summary
        run: |
          git diff --stat | tail -4
          git diff --numstat
      - name: Run site checks
        run: |
          set -e
          node scripts/check-site-consistency.mjs
          node scripts/audit-search.mjs --strict
          python3 scripts/test-crawl-policy.py
          python3 scripts/audit-technical-seo.py --strict
          python3 scripts/test-technical-seo.py
          node --test scripts/test-lead-tracking.mjs
          node --test scripts/test-traffic-context.mjs
          node --test scripts/test-rfq-context.mjs
          node --test scripts/test-inquiry-context.mjs
          node --test scripts/test-club-planning.cjs
          python3 scripts/test-indexnow.py
          python3 scripts/sync-buyer-content.py
          python3 scripts/test-buyer-content.py
          python3 scripts/test-keyword-intent.py
          python3 scripts/sync-guide-content.py
          python3 scripts/test-guide-evidence.py
      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Homepage: merge duplicate sections" -m "Remove the repeated solutions block (hub links moved under the court systems grid) and the repeated step grid in the brand profile block. Fingerprint refreshed."
          git push
