name: Temporary CTA unify (delete before merge)

on:
  push:
    branches: [cta-unify]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply CTA unification with byte-preserving edits
        run: |
          python3 - <<'PY'
          import re, glob
          NEW_VER = "20261014-cta1"

          p = "index.html"
          b = open(p, "rb").read()
          start = b.index(b'<section class="home-hero"')
          end = b.index(b"</section>", start) + len(b"</section>")
          hero = b[start:end]
          n = hero.count(b"Discuss Your Project")
          assert n == 1, "hero label count is %d, expected 1" % n
          b = b[:start] + hero.replace(b"Discuss Your Project", b"Start Your Project") + b[end:]
          open(p, "wb").write(b)
          print("hero label updated")

          p = "assets/site-v2.js"
          j = open(p, "rb").read()
          n = j.count(b"Start Project")
          assert n == 1, "site-v2.js label count is %d, expected 1" % n
          open(p, "wb").write(j.replace(b"Start Project", b"Start Your Project"))
          print("floating label updated")

          pat = re.compile(b"site-v2[.]js[?]v=[A-Za-z0-9._-]+")
          old = {}
          changed = 0
          for f in glob.glob("**/*.html", recursive=True):
              d = open(f, "rb").read()
              for m in pat.findall(d):
                  old[m] = old.get(m, 0) + 1
              new, c = pat.subn(b"site-v2.js?v=" + NEW_VER.encode(), d)
              if c:
                  open(f, "wb").write(new)
                  changed += 1
          print("old versions:", old)
          print("pages bumped:", changed)
          assert changed > 0, "no page loads site-v2.js with a version"
          PY
      - name: Record the intentional hero hash change
        run: |
          grep -rl "bf3cc31102cce2d665479020d46f9ca11f2a13c49099e269b798e127df3dd221" . --exclude-dir=.git --exclude-dir=.github
          python3 - <<'PY'
          OLD = b"bf3cc31102cce2d665479020d46f9ca11f2a13c49099e269b798e127df3dd221"
          NEW = b"c3a67f369b74b1abf7b943466c6b6ebef8efc66169ea3d3968e08c1e5c444c7c"
          f = "scripts/test-technical-seo.py"
          d = open(f, "rb").read()
          assert d.count(OLD) == 1, "expected exactly one hero hash in " + f
          open(f, "wb").write(d.replace(OLD, NEW))
          print("hero hash in", f, "updated")
          PY
      - name: Refresh content fingerprints
        run: node scripts/sync-search-metadata.mjs --write
      - name: Change summary
        run: |
          git diff --stat | tail -5
          git diff --numstat index.html assets/site-v2.js scripts/test-technical-seo.py
      - name: Run site checks
        run: |
          set -e
          node scripts/check-site-consistency.mjs
          node scripts/audit-search.mjs --strict
          python3 scripts/test-crawl-policy.py
          python3 scripts/audit-technical-seo.py --strict
          python3 scripts/test-technical-seo.py
          node --test scripts/test-lead-tracking.mjs
          node --test scripts/test-traffic-context.mjs
          node --test scripts/test-rfq-context.mjs
          node --test scripts/test-inquiry-context.mjs
          node --test scripts/test-club-planning.cjs
          python3 scripts/test-indexnow.py
          python3 scripts/sync-buyer-content.py
          python3 scripts/test-buyer-content.py
          python3 scripts/test-keyword-intent.py
          python3 scripts/sync-guide-content.py
          python3 scripts/test-guide-evidence.py
      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Unify primary CTA label to Start Your Project" -m "Hero button and floating button now read Start Your Project, matching header and footer. site-v2.js version bumped on pages that load it. Fingerprints refreshed. The protected hero hash in scripts/test-technical-seo.py is updated on purpose because the hero button text changed."
          git push
