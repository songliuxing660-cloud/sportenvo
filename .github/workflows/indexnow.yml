name: IndexNow Notify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit updated URLs to IndexNow
        env:
          INDEXNOW_KEY: e4dd47094ff34da4b267c81f6f1bc9f6
          SITE_HOST: sportenvo.com
          SITE_ROOT: https://sportenvo.com
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error, time, hashlib, re
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import xml.etree.ElementTree as ET

          key = os.environ["INDEXNOW_KEY"]
          host = os.environ["SITE_HOST"]
          root = os.environ["SITE_ROOT"].rstrip("/")
          key_location = f"{root}/{key}.txt"

          def sitemap_urls():
              # Read the checked-out sitemap first so IndexNow does not depend on
              # the production CDN being updated or publicly fetchable at this moment.
              with open("sitemap.xml", "rb") as f:
                  xml = f.read()
              tree = ET.fromstring(xml)
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              return [x.text.strip() for x in tree.findall("sm:url/sm:loc", ns) if x.text]

          urls = []
          eligible = set(sitemap_urls())
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "push":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
                  before = json.load(f).get("before", "")
              if before and set(before) != {"0"}:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, "HEAD"], text=True
                  ).splitlines()
                  for path in changed:
                      if not path.endswith(".html"):
                          continue
                      if path == "index.html":
                          url = root + "/"
                      elif path.endswith("/index.html"):
                          url = root + "/" + path[:-len("index.html")]
                      else:
                          url = root + "/" + path
                      if url in eligible:
                          urls.append(url)
              else:
                  urls = list(eligible)

          if event == "workflow_dispatch":
              urls = list(eligible)
          if not urls:
              print("No indexable HTML changes; skipping IndexNow.")
              raise SystemExit(0)

          # IndexNow accepts up to 10,000 URLs per POST; keep this site batch compact.
          urls = sorted(set(urls))
          if len(urls) > 10000:
              raise RuntimeError("Split the submission into batches of at most 10,000 URLs.")

          def normalized(body):
              return body.decode("utf-8-sig").replace("\r\n", "\n").strip()

          class FingerprintParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta" and attrs.get("name") == "sportenvo-content-sha256":
                      self.values.append(attrs.get("content", ""))

          def matches_revision(live, local):
              # Cloudflare legitimately rewrites email links and inserts analytics.
              # The immutable source fingerprint survives those edge transformations.
              source = re.sub(r'<meta name="sportenvo-content-sha256" content="[a-f0-9]{64}">\n', '', normalized(local))
              expected = hashlib.sha256(source.strip().encode("utf-8")).hexdigest()
              parser = FingerprintParser()
              parser.feed(normalized(live))
              return parser.values == [expected]

          def ready(url):
              local_path = url[len(root):].lstrip("/") or "index.html"
              if local_path.endswith("/"):
                  local_path += "index.html"
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "SPORTENVO-Deployment-Check/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = r.read()
                  return matches_revision(body, Path(local_path).read_bytes())
              except (OSError, UnicodeError):
                  return False

          # Main-branch notifications can start before GitHub Pages deployment finishes.
          pending = list(urls)
          deadline = time.monotonic() + 300
          while pending:
              with ThreadPoolExecutor(max_workers=4) as pool:
                  results = list(pool.map(ready, pending))
              pending = [url for url, published in zip(pending, results) if not published]
              if not pending:
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError(f"Production is not serving {len(pending)} updated pages yet; no notification sent.")
              print(f"Waiting for deployment: {len(pending)} page(s).")
              time.sleep(10)
          with urllib.request.urlopen(key_location, timeout=15) as r:
              if r.read().decode("utf-8").strip() != key:
                  raise RuntimeError("Production IndexNow key file does not match.")
          payload = {
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("IndexNow notification response:", r.status)
                  print("Notification accepted; indexing is decided separately by each search engine.")
                  print("Submitted URLs:", len(urls))
                  for u in urls:
                      print(u)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              print("IndexNow HTTP error:", e.code, body)
              # 202 means accepted with validation pending and is not an error for IndexNow.
              if e.code != 202:
                  raise
          PY
