name: Lighthouse mobile audit

on:
  push:
    paths:
      - '.github/workflows/lighthouse-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Lighthouse
        run: npm install -g lighthouse@latest
      - name: Run mobile Lighthouse
        run: |
          lighthouse https://sportenvo.com/             --only-categories=performance             --output=json             --output-path=lighthouse.json             --chrome-flags="--headless --no-sandbox"             --quiet
      - name: Print key metrics
        run: |
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('lighthouse.json','utf8'));
          const a=r.audits;
          const out={
            performance:Math.round((r.categories.performance.score||0)*100),
            fcp:a['first-contentful-paint']?.displayValue,
            lcp:a['largest-contentful-paint']?.displayValue,
            speedIndex:a['speed-index']?.displayValue,
            tbt:a['total-blocking-time']?.displayValue,
            cls:a['cumulative-layout-shift']?.displayValue,
            renderBlocking:a['render-blocking-resources']?.displayValue || null,
            unusedJs:a['unused-javascript']?.displayValue || null
          };
          console.log('LIGHTHOUSE_METRICS '+JSON.stringify(out));
          for (const [id,v] of Object.entries(a)) {
            if (/lcp|largest-contentful|render-block|unused-javascript|mainthread|long-task|third-part|network-dependency|bootup-time/i.test(id)) {
              console.log('\nAUDIT '+id+'\n'+JSON.stringify({title:v.title,score:v.score,displayValue:v.displayValue,details:v.details},null,2));
            }
          }
          NODE
